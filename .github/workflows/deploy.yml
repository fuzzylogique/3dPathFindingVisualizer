name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Build WASM
        working-directory: pathfind3d
        run: wasm-pack build --target web --out-dir web/pkg --release

      # wasm-pack writes a .gitignore into pkg/ that would exclude it from the upload
      - name: Remove pkg .gitignore
        run: rm -f pathfind3d/web/pkg/.gitignore

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pathfind3d/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
