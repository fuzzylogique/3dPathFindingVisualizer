<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#020409">
<link rel="icon" href="data:,">
<meta name="description" content="Volumetric pathfinding visualizer — eight algorithms over weighted voxel domains (cube, pyramid, sphere, torus) searched in true 3D, rendered as a neon light-trail. Rust→WASM core with a JS mirror.">
<title>PATHGRID — volumetric pathfinding light-trail</title>
<style>
:root{
  --cy:#4ff2ff; --cy-dim:#227e9b; --am:#ffb054; --hot:#ff6a4d;
  --bg:#020409; --panel:rgba(5,12,22,.87); --line:rgba(79,242,255,.22);
  --tx:#c9eef5; --tx-dim:#5d87a0;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--tx); overflow:hidden;
  font:13px/1.45 Consolas,"SF Mono",ui-monospace,Menlo,monospace;
  -webkit-font-smoothing:antialiased;
}
canvas#scene{position:fixed; inset:0; display:block; touch-action:none; cursor:grab}
canvas#scene:active{cursor:grabbing}
body[data-mode="wall"] canvas#scene,body[data-mode="weight"] canvas#scene,
body[data-mode="erase"] canvas#scene,body[data-mode="route"] canvas#scene,
body[data-mode="start"] canvas#scene,body[data-mode="goal"] canvas#scene{cursor:crosshair}
#vignette{
  position:fixed; inset:0; pointer-events:none; z-index:2;
  background:radial-gradient(130% 130% at 50% 42%, transparent 52%, rgba(0,2,6,.62) 100%);
}
#brand{position:fixed; top:14px; left:16px; z-index:4; text-shadow:0 0 14px rgba(79,242,255,.35)}
#brand h1{margin:0; font-size:15px; font-weight:700; letter-spacing:.38em; color:var(--cy)}
#brand p{margin:3px 0 0; font-size:10px; letter-spacing:.2em; color:var(--tx-dim); text-transform:uppercase}

#panel{
  position:fixed; top:14px; right:14px; z-index:4; width:264px; max-height:calc(100vh - 28px);
  overflow:auto; overscroll-behavior:contain;
  background:var(--panel); border:1px solid var(--line); border-radius:10px;
  padding:12px; backdrop-filter:blur(8px);
  box-shadow:0 0 26px rgba(0,229,255,.07), inset 0 0 18px rgba(0,229,255,.04);
}
#stStatus{
  font-size:13px; font-weight:700; letter-spacing:.2em; text-align:center;
  padding:6px 0 8px; color:var(--tx-dim);
}
#stStatus[data-s="run"]{color:var(--cy); text-shadow:0 0 10px rgba(79,242,255,.6)}
#stStatus[data-s="found"]{color:var(--am); text-shadow:0 0 10px rgba(255,176,84,.6)}
#stStatus[data-s="nopath"]{color:var(--hot); text-shadow:0 0 10px rgba(255,106,77,.5)}
#stStatus[data-s="draw"]{color:var(--cy)}
.stats{display:grid; grid-template-columns:1fr 1fr; gap:5px; margin-bottom:8px}
.stats>div{
  border:1px solid rgba(79,242,255,.12); border-radius:6px; padding:5px 8px;
  display:flex; justify-content:space-between; align-items:baseline; gap:6px;
}
.stats span{font-size:9px; letter-spacing:.14em; color:var(--tx-dim)}
.stats b{font-size:12px; color:var(--tx); font-weight:700; overflow:hidden; text-overflow:ellipsis}
#cmp{border:1px solid rgba(255,176,84,.25); border-radius:6px; padding:6px 8px; margin-bottom:8px}
#cmp[hidden]{display:none}
.cmpRow{display:flex; justify-content:space-between; font-size:10px; letter-spacing:.12em; margin:2px 0}
.cmpRow span{color:var(--tx-dim)} .cmpRow b{font-weight:700}
.cmpRow.you b{color:var(--cy)} .cmpRow.opt b{color:#d9f2f7} .cmpRow.alg b{color:var(--am)}
#cmpVerdict{font-size:9px; letter-spacing:.1em; color:var(--tx-dim); text-align:center; margin-top:4px; text-transform:uppercase}
.meta{font-size:9px; letter-spacing:.1em; color:var(--tx-dim); text-align:center; margin-bottom:4px}
.meta b{color:var(--am); font-weight:700}
.meta i{font-style:normal; color:var(--tx)}

.btns{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:8px 0 8px}
button{
  font:inherit; font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--cy); background:rgba(16,42,58,.5); border:1px solid var(--line);
  border-radius:6px; padding:8px 4px; cursor:pointer; min-height:34px;
}
button:hover{background:rgba(28,80,104,.6); box-shadow:0 0 10px rgba(79,242,255,.25)}
button:active{transform:translateY(1px)}
button.primary{color:#03202b; background:var(--cy); border-color:var(--cy); font-weight:700}
button.primary:hover{box-shadow:0 0 18px rgba(79,242,255,.6)}
:focus-visible{outline:2px solid var(--cy); outline-offset:2px; border-radius:4px}

select{
  font:inherit; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--tx); background:rgba(16,42,58,.5); border:1px solid var(--line);
  border-radius:6px; padding:6px; width:100%; cursor:pointer; min-height:32px;
}
.desc{font-size:9px; letter-spacing:.08em; color:var(--tx-dim); margin:4px 1px 2px; min-height:12px}

details{border-top:1px solid rgba(79,242,255,.14); margin-top:8px; padding-top:2px}
summary{
  font-size:10px; letter-spacing:.22em; color:var(--tx-dim); text-transform:uppercase;
  cursor:pointer; padding:6px 0; list-style:none; user-select:none;
}
summary::before{content:"▸ "; color:var(--cy-dim)}
details[open] summary::before{content:"▾ "}
summary:hover{color:var(--tx)}

.row{
  display:grid; grid-template-columns:56px 1fr 44px; align-items:center; gap:8px;
  margin:7px 0; font-size:10px; letter-spacing:.14em; color:var(--tx-dim); text-transform:uppercase;
}
.row output{text-align:right; color:var(--tx); font-size:11px}
input[type=range]{width:100%; accent-color:var(--cy); height:22px; background:transparent; cursor:pointer}
#sWeight{
  accent-color:var(--hot); border-radius:4px; height:14px;
  background:linear-gradient(90deg,#2a1a0e,#8f4d20,#ff6a4d);
}
.modes{display:grid; grid-template-columns:repeat(4,1fr); gap:5px; margin:6px 0}
.modes button{padding:6px 2px; min-height:30px; font-size:9px; letter-spacing:.08em}
.modes button.on{color:#03202b; background:var(--cy); border-color:var(--cy); font-weight:700}
#routeBtns{display:grid; grid-template-columns:1fr 1fr; gap:5px; margin:6px 0}
#routeBtns[hidden]{display:none}
.tgs{display:grid; gap:6px; margin-top:6px}
.tg{
  display:flex; gap:9px; align-items:center; cursor:pointer;
  font-size:10px; letter-spacing:.14em; color:var(--tx-dim); text-transform:uppercase; min-height:22px;
}
.tg input{accent-color:var(--cy); width:15px; height:15px; margin:0; cursor:pointer}
.keys{margin:10px 0 0; font-size:9px; color:var(--tx-dim); letter-spacing:.12em; text-align:center}

#hint{
  position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:3;
  font-size:10px; letter-spacing:.24em; color:var(--tx-dim); text-transform:uppercase;
  pointer-events:none; transition:opacity 1.4s; text-align:center; max-width:92vw;
}
#hint.gone{opacity:0}
#hint.warn{color:var(--hot); transition:none}
#err{
  position:fixed; inset:0; z-index:9; display:none; place-items:center;
  background:rgba(2,4,9,.94); color:var(--hot); text-align:center; padding:24px;
  font-size:13px; letter-spacing:.08em;
}
noscript{position:fixed; inset:0; z-index:9; display:grid; place-items:center; color:var(--hot)}
.srOnly{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden}
@media (max-width:700px){
  #panel{top:auto; bottom:10px; left:10px; right:10px; width:auto; max-height:48vh}
  #brand h1{font-size:12px}
  #brand p{font-size:9px}
  #hint:not(.warn){display:none} /* warnings must stay visible on phones */
  #hint.warn{bottom:52vh}
  .keys{display:none}
}
@media (prefers-reduced-motion: reduce){
  #hint{transition:none}
}
</style>
</head>
<body data-mode="view">
<div id="vignette" aria-hidden="true"></div>

<header id="brand">
  <h1>PATHGRID</h1>
  <p>volumetric search &middot; 26-connected &middot; rust&rarr;wasm</p>
</header>

<aside id="panel" aria-label="Pathfinder controls">
  <div id="stStatus" data-s="ready" role="status" aria-live="polite">READY</div>
  <div class="stats">
    <div><span>EXPANDED</span><b id="stExp">0</b></div>
    <div><span>FRONTIER</span><b id="stFro">0</b></div>
    <div><span>PATH</span><b id="stPath">&mdash;</b></div>
    <div><span>COST</span><b id="stCost">&mdash;</b></div>
  </div>
  <div id="cmp" hidden>
    <div class="cmpRow you"><span>YOUR ROUTE</span><b id="cmpYou">&mdash;</b></div>
    <div class="cmpRow opt"><span>OPTIMAL</span><b id="cmpOpt">&mdash;</b></div>
    <div class="cmpRow alg"><span id="cmpAlgName">ALGORITHM</span><b id="cmpAlg">&mdash;</b></div>
    <div id="cmpVerdict"></div>
  </div>
  <div class="meta">CORE <b id="stCore">JS</b> &middot; <i id="stCells"></i> &middot; SEED <i id="stSeed"></i></div>
  <div class="btns">
    <button id="bPlay" class="primary" aria-keyshortcuts="Space">&#9654; RUN</button>
    <button id="bStep">STEP</button>
    <button id="bReset">RESET</button>
    <button id="bRand">RANDOMIZE</button>
  </div>
  <div class="row"><label for="sSpeed">SPEED</label><input id="sSpeed" type="range" min="1" max="400" value="8"><output id="oSpeed" for="sSpeed">8</output></div>

  <label for="selAlgo" class="desc" style="margin-top:6px">ALGORITHM</label>
  <select id="selAlgo" aria-label="Algorithm">
    <option value="0" selected>A*</option>
    <option value="1">Dijkstra</option>
    <option value="2">Greedy Best-First</option>
    <option value="3">Swarm</option>
    <option value="4">Convergent Swarm</option>
    <option value="5">Bidirectional Swarm</option>
    <option value="6">Breadth-First (BFS)</option>
    <option value="7">Depth-First (DFS)</option>
  </select>
  <div class="desc" id="algoDesc"></div>

  <details open>
    <summary>World</summary>
    <label for="selDomain" class="desc">DOMAIN</label>
    <select id="selDomain" aria-label="Domain preset">
      <option value="cube" selected>Cube</option>
      <option value="prism">Rectangular prism</option>
      <option value="pyramid">Pyramid</option>
      <option value="sphere">Sphere</option>
      <option value="torus">Torus (wraps)</option>
    </select>
    <div class="desc" id="domDesc"></div>
    <div class="row"><label for="sGrid">SIZE</label><input id="sGrid" type="range" min="10" max="26" step="2" value="22"><output id="oGrid" for="sGrid">22</output></div>
    <div class="row"><label for="sDens">DENSITY</label><input id="sDens" type="range" min="0" max="40" value="18"><output id="oDens" for="sDens">18%</output></div>
    <div class="btns" style="margin:6px 0 2px">
      <button id="bClear" style="grid-column:1/-1">CLEAR OBSTACLES &amp; WEIGHTS</button>
    </div>
    <label class="tg"><input type="checkbox" id="tEmpty"><span>START EMPTY ON REBUILD</span></label>
  </details>

  <details open>
    <summary>Edit</summary>
    <div class="modes" role="group" aria-label="Edit mode">
      <button data-m="view" class="on" aria-pressed="true">VIEW</button>
      <button data-m="start" aria-pressed="false">START</button>
      <button data-m="goal" aria-pressed="false">GOAL</button>
      <button data-m="route" aria-pressed="false">ROUTE</button>
      <button data-m="wall" aria-pressed="false">WALL</button>
      <button data-m="weight" aria-pressed="false">WEIGHT</button>
      <button data-m="erase" aria-pressed="false">ERASE</button>
    </div>
    <div id="routeBtns" hidden>
      <button id="bUndoRoute">UNDO LEG</button>
      <button id="bClearRoute">CLEAR ROUTE</button>
    </div>
    <div class="row"><label for="sWeight">BRUSH W</label><input id="sWeight" type="range" min="1" max="10" value="5"><output id="oWeight" for="sWeight">5</output></div>
    <div class="row">
      <label for="selSliceAxis">SLICE</label>
      <select id="selSliceAxis" style="min-height:24px;padding:2px" aria-label="Slice axis">
        <option value="0">X</option><option value="1" selected>Y</option><option value="2">Z</option>
      </select>
      <output id="oSlice">&mdash;</output>
    </div>
    <div class="row"><label for="sSlice">LAYER</label><input id="sSlice" type="range" min="0" max="21" value="0"><span></span></div>
    <label class="tg"><input type="checkbox" id="tSlice" checked><span>BUILD SLICE GHOST</span></label>
  </details>

  <details>
    <summary>Visibility</summary>
    <div class="row"><label for="sXray">X-RAY</label><input id="sXray" type="range" min="2" max="50" value="12"><output id="oXray" for="sXray">12%</output></div>
    <div class="row">
      <label for="selClipAxis">CLIP</label>
      <select id="selClipAxis" style="min-height:24px;padding:2px" aria-label="Clip axis">
        <option value="0">X</option><option value="1">Y</option><option value="2" selected>Z</option>
      </select>
      <span></span>
    </div>
    <div class="row"><label for="sClip">DEPTH</label><input id="sClip" type="range" min="0" max="100" value="100"><output id="oClip" for="sClip">OFF</output></div>
    <div class="tgs">
      <label class="tg"><input type="checkbox" id="tClip"><span>CLIP SLICE ON</span></label>
      <label class="tg"><input type="checkbox" id="tCloud" checked><span>EXPLORED CLOUD</span></label>
      <label class="tg"><input type="checkbox" id="tRotate" checked><span>AUTO-ROTATE</span></label>
      <label class="tg"><input type="checkbox" id="tDiag" checked><span>DIAGONAL MOVES (26-DIR)</span></label>
    </div>
  </details>

  <p class="keys">SPACE run &middot; S step &middot; R randomize &middot; ESC view &middot; [ ] slice &middot; ARROWS orbit</p>
</aside>

<div id="hint">DRAG TO ORBIT &middot; SCROLL / PINCH TO ZOOM</div>
<div id="announce" class="srOnly" role="status" aria-live="polite"></div>
<div id="err" role="alert"></div>
<noscript><p>This visualizer requires JavaScript.</p></noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">
'use strict';

/* ================================================================== */
/* === SOLVER CORE BEGIN ===                                          */
/* JS mirror of src/lib.rs — same constructor args, same constants,   */
/* same costs, same expansion order, same duplicate-push semantics.   */
/* Keep in sync. Index convention everywhere: idx = x + nx*(y + ny*z).*/
/* This block is dependency-free (no DOM, no THREE) so it can be      */
/* extracted and tested under Node — see tests/mirror.test.mjs.       */
/* ================================================================== */

const FREE = 0, OBST = 1, OPEN = 2, CLOSED = 3, PATH = 4; // must match src/lib.rs
const T_VOID = 0, T_OBST = 255, W_MAX = 10;               // terrain encoding
const ALGO_ASTAR = 0, ALGO_DIJKSTRA = 1, ALGO_GREEDY = 2, ALGO_SWARM = 3,
      ALGO_CONVERGENT = 4, ALGO_BISWARM = 5, ALGO_BFS = 6, ALGO_DFS = 7;
const SWARM_H = 1.5, CONVERGENT_H = 3.0;
const SQRT_2 = Math.SQRT2;
const SQRT_3 = Math.sqrt(3);
const STEP_COST = [0, 1, SQRT_2, SQRT_3]; // indexed by axes touched
const EPS = 1e-12;
const NO_PARENT = -1;
const FR_PQ = 0, FR_FIFO = 1, FR_LIFO = 2;
const UNSEEN = 0, S_OPEN = 1, S_CLOSED = 2;

const ALGO_DEF = { // frontier kind, g weight, h weight — the whole table
  [ALGO_ASTAR]:      [FR_PQ, 1, 1],
  [ALGO_DIJKSTRA]:   [FR_PQ, 1, 0],
  [ALGO_GREEDY]:     [FR_PQ, 0, 1],
  [ALGO_SWARM]:      [FR_PQ, 1, SWARM_H],
  [ALGO_CONVERGENT]: [FR_PQ, 1, CONVERGENT_H],
  [ALGO_BISWARM]:    [FR_PQ, 1, SWARM_H],
  [ALGO_BFS]:        [FR_FIFO, 1, 0],
  [ALGO_DFS]:        [FR_LIFO, 1, 0],
};

class MinHeap {
  // Orders by lowest f, tie-break lowest h — mirrors the reversed Ord on
  // the Rust max-heap Node (final idx tiebreak keeps the order total).
  constructor() { this.f = []; this.h = []; this.i = []; }
  size() { return this.f.length; }
  _lt(a, b) {
    const F = this.f, H = this.h, I = this.i;
    if (F[a] !== F[b]) return F[a] < F[b];
    if (H[a] !== H[b]) return H[a] < H[b];
    return I[a] > I[b];
  }
  _swap(a, b) {
    const F = this.f, H = this.h, I = this.i; let t;
    t = F[a]; F[a] = F[b]; F[b] = t;
    t = H[a]; H[a] = H[b]; H[b] = t;
    t = I[a]; I[a] = I[b]; I[b] = t;
  }
  push(f, h, i) {
    this.f.push(f); this.h.push(h); this.i.push(i);
    let c = this.f.length - 1;
    while (c > 0) {
      const p = (c - 1) >> 1;
      if (this._lt(c, p)) { this._swap(c, p); c = p; } else break;
    }
  }
  pop() {
    const m = this.f.length;
    if (!m) return -1;
    const top = this.i[0];
    this._swap(0, m - 1);
    this.f.pop(); this.h.pop(); this.i.pop();
    let c = 0; const k = this.f.length;
    for (;;) {
      const l = 2 * c + 1, r = l + 1; let s = c;
      if (l < k && this._lt(l, s)) s = l;
      if (r < k && this._lt(r, s)) s = r;
      if (s === c) break;
      this._swap(c, s); c = s;
    }
    return top;
  }
}

/* One directional search: its own frontier, scores, parents, status.
   Bidirectional Swarm holds two (0 = from start, 1 = from goal). */
class Search {
  constructor(total, target) {
    this.heap = new MinHeap();
    this.fifo = [];      // entries {i, p, g}; head index avoids O(n) shift
    this.fifoH = 0;
    this.lifo = [];      // entries {i, p, g}; duplicates allowed (DFS)
    this.g = new Float64Array(total).fill(Infinity);
    this.parent = new Int32Array(total).fill(NO_PARENT);
    this.stat = new Uint8Array(total); // UNSEEN / S_OPEN / S_CLOSED
    this.target = target;
  }
}

class JsSolver {
  constructor(nx, ny, nz, terrain, wrapX, wrapY, wrapZ, sx, sy, sz, gx, gy, gz, diagonals, algo) {
    nx |= 0; ny |= 0; nz |= 0;
    const total = nx * ny * nz;
    if (nx < 1 || ny < 1 || nz < 1) throw new Error('dims must be >= 1');
    if (sx >= nx || sy >= ny || sz >= nz) throw new Error('start out of bounds');
    if (gx >= nx || gy >= ny || gz >= nz) throw new Error('goal out of bounds');
    if (!(algo >= 0 && algo <= ALGO_DFS)) throw new Error('unknown algorithm id');
    if (terrain.length !== total) throw new Error('terrain must have nx*ny*nz entries');
    this.nx = nx; this.ny = ny; this.nz = nz;
    this.wrap = [!!wrapX, !!wrapY, !!wrapZ];
    this.diagonals = !!diagonals;
    this._algo = algo;
    [this.frontierKind, this.gW, this.hW] = ALGO_DEF[algo];

    // Sanitise terrain: keep void/obstacle markers, clamp weights into range.
    const t = new Uint8Array(total);
    for (let i = 0; i < total; i++) {
      const v = terrain[i];
      t[i] = (v === T_VOID || v === T_OBST) ? v : (v > W_MAX ? W_MAX : v);
    }
    const start = sx + nx * (sy + ny * sz);
    const goal = gx + nx * (gy + ny * gz);
    // Endpoints must never be obstacles; void endpoints stay void (= no path).
    if (t[start] === T_OBST) t[start] = 1;
    if (t[goal] === T_OBST) t[goal] = 1;
    this.terrain = t;
    this.startIdx = start;
    this.goalIdx = goal;

    this.cells = new Uint8Array(total); // shared viz buffer
    for (let i = 0; i < total; i++) if (t[i] === T_OBST) this.cells[i] = OBST;

    this.searches = [new Search(total, goal)];
    if (algo === ALGO_BISWARM) this.searches.push(new Search(total, start));
    this.turn = 0;
    this._expanded = 0;
    this._frontier = 0;
    this._done = false;
    this._found = false;
    this._cost = NaN;
    this._path = new Uint32Array(0);

    // Degenerate cases resolved at construction.
    if (t[start] === T_VOID || t[goal] === T_VOID) { this._done = true; return; }
    if (start === goal) {
      this._done = true; this._found = true; this._cost = 0;
      this._path = Uint32Array.of(start);
      this.cells[start] = PATH;
      return;
    }

    const origins = algo === ALGO_BISWARM ? [start, goal] : [start];
    for (let si = 0; si < origins.length; si++) {
      const origin = origins[si], sr = this.searches[si];
      const h = this._heur(origin, sr.target);
      sr.g[origin] = 0;
      sr.stat[origin] = S_OPEN;
      if (this.frontierKind === FR_PQ) sr.heap.push(this.gW * 0 + this.hW * h, h, origin);
      else if (this.frontierKind === FR_FIFO) sr.fifo.push({ i: origin, p: NO_PARENT, g: 0 });
      else sr.lifo.push({ i: origin, p: NO_PARENT, g: 0 });
      this._frontier++;
      if (this.cells[origin] === FREE) this.cells[origin] = OPEN;
    }
  }

  _coords(idx) {
    return [idx % this.nx, ((idx / this.nx) | 0) % this.ny, (idx / (this.nx * this.ny)) | 0];
  }

  _axisDelta(a, b, n, wrapped) {
    let d = Math.abs(a - b);
    if (wrapped) d = Math.min(d, n - d);
    return d;
  }

  // Exact minimum base cost across an empty grid — admissible since every
  // weight is >= 1. Wrapped axes use min(|d|, n-|d|) or A* overestimates.
  _heur(idx, target) {
    const [x, y, z] = this._coords(idx);
    const [tx, ty, tz] = this._coords(target);
    let a = this._axisDelta(x, tx, this.nx, this.wrap[0]);
    let b = this._axisDelta(y, ty, this.ny, this.wrap[1]);
    let c = this._axisDelta(z, tz, this.nz, this.wrap[2]);
    if (!this.diagonals) return a + b + c;
    let t;
    if (a < b) { t = a; a = b; b = t; }
    if (b < c) { t = b; b = c; c = t; }
    if (a < b) { t = a; a = b; b = t; }
    return (a - b) + (b - c) * SQRT_2 + c * SQRT_3;
  }

  // Pop the next closable entry, skipping stale duplicates. Returns
  // {i, p, g} or null; p/g only meaningful for the LIFO frontier.
  _popValid(si) {
    const sr = this.searches[si];
    if (this.frontierKind === FR_PQ) {
      for (;;) {
        if (sr.heap.size() === 0) return null;
        const i = sr.heap.pop();
        if (sr.stat[i] === S_OPEN) return { i, p: sr.parent[i], g: sr.g[i] };
      }
    }
    if (this.frontierKind === FR_FIFO) {
      if (sr.fifoH >= sr.fifo.length) return null;
      const e = sr.fifo[sr.fifoH++];
      if (sr.fifoH > 2048 && sr.fifoH * 2 > sr.fifo.length) {
        sr.fifo = sr.fifo.slice(sr.fifoH); sr.fifoH = 0;
      }
      return e;
    }
    for (;;) {
      const e = sr.lifo.pop();
      if (!e) return null;
      if (sr.stat[e.i] !== S_CLOSED) return e;
    }
  }

  step_many(steps) {
    for (let i = 0; i < steps; i++) {
      if (this._done) break;
      this._stepOnce();
    }
  }

  _stepOnce() {
    const ns = this.searches.length;
    let si = this.turn % ns, e = null;
    for (let t = 0; t < ns; t++) {
      e = this._popValid(si);
      if (e) break;
      si = (si + 1) % ns;
    }
    if (!e) { this._done = true; this._found = false; return; }

    const ui = e.i, sr = this.searches[si];
    if (this.frontierKind === FR_LIFO) {
      // Commit the branch this entry actually came from.
      sr.parent[ui] = e.p;
      sr.g[ui] = e.g;
    }
    sr.stat[ui] = S_CLOSED;
    this.cells[ui] = CLOSED;
    this._frontier--;
    this._expanded++;
    this.turn = (si + 1) % ns;

    if (ns === 2) {
      // Bidirectional termination: the closed sets first intersect.
      if (this.searches[1 - si].stat[ui] === S_CLOSED) { this._finishBidirectional(ui); return; }
    } else if (ui === this.goalIdx) {
      this._done = true;
      this._found = true;
      this._path = Uint32Array.from(this._walkParents(0, this.goalIdx));
      this._finishPath();
      return;
    }

    this._expand(si, ui);
  }

  _expand(si, idx) {
    const { nx, ny, nz, terrain, diagonals } = this;
    const sr = this.searches[si];
    const x = idx % nx, y = ((idx / nx) | 0) % ny, z = (idx / (nx * ny)) | 0;
    const gHere = sr.g[idx];
    const target = sr.target;
    for (let dz = -1; dz <= 1; dz++) {
      let z2 = z + dz;
      if (z2 < 0 || z2 >= nz) {
        if (!this.wrap[2]) continue;
        z2 = (z2 + nz) % nz;
      }
      for (let dy = -1; dy <= 1; dy++) {
        let y2 = y + dy;
        if (y2 < 0 || y2 >= ny) {
          if (!this.wrap[1]) continue;
          y2 = (y2 + ny) % ny;
        }
        for (let dx = -1; dx <= 1; dx++) {
          if (dx === 0 && dy === 0 && dz === 0) continue;
          const k = Math.abs(dx) + Math.abs(dy) + Math.abs(dz);
          if (!diagonals && k > 1) continue;
          let x2 = x + dx;
          if (x2 < 0 || x2 >= nx) {
            if (!this.wrap[0]) continue;
            x2 = (x2 + nx) % nx;
          }
          const ni = x2 + nx * (y2 + ny * z2);
          if (ni === idx) continue; // wrap on a 1-cell axis folds onto itself
          const t = terrain[ni];
          if (t === T_VOID || t === T_OBST) continue;
          if (sr.stat[ni] === S_CLOSED) continue;
          if (this.frontierKind === FR_PQ) {
            const ng = gHere + STEP_COST[k] * t;
            if (ng < sr.g[ni] - EPS) {
              sr.g[ni] = ng;
              sr.parent[ni] = idx;
              if (sr.stat[ni] === UNSEEN) {
                sr.stat[ni] = S_OPEN;
                this._frontier++;
                if (this.cells[ni] === FREE) this.cells[ni] = OPEN;
              }
              const h = this._heur(ni, target);
              sr.heap.push(this.gW * ng + this.hW * h, h, ni);
            }
          } else if (this.frontierKind === FR_FIFO) {
            // Unweighted hop search: first discovery is the fewest-hops
            // route, never re-pushed.
            if (sr.stat[ni] === UNSEEN) {
              sr.stat[ni] = S_OPEN;
              sr.g[ni] = gHere + 1;
              sr.parent[ni] = idx;
              sr.fifo.push({ i: ni, p: idx, g: gHere + 1 });
              this._frontier++;
              if (this.cells[ni] === FREE) this.cells[ni] = OPEN;
            }
          } else {
            // Depth-first: duplicates allowed so the newest branch is always
            // explored first; each entry remembers the branch it came from.
            if (sr.stat[ni] === UNSEEN) {
              sr.stat[ni] = S_OPEN;
              this._frontier++;
              if (this.cells[ni] === FREE) this.cells[ni] = OPEN;
            }
            sr.lifo.push({ i: ni, p: idx, g: gHere + 1 });
          }
        }
      }
    }
  }

  _walkParents(si, from) {
    const par = this.searches[si].parent;
    const rev = [from];
    let cur = from;
    while (par[cur] !== NO_PARENT) {
      cur = par[cur];
      rev.push(cur);
    }
    rev.reverse();
    return rev;
  }

  // Stitch the two half-paths at the meeting cell: start..meet from the
  // forward parents, then the reverse search's chain runs meet -> goal.
  _finishBidirectional(meet) {
    this._done = true;
    this._found = true;
    const path = this._walkParents(0, meet);
    const par = this.searches[1].parent;
    let cur = par[meet];
    while (cur !== NO_PARENT) {
      path.push(cur);
      cur = par[cur];
    }
    this._path = Uint32Array.from(path);
    this._finishPath();
  }

  _finishPath() {
    this._cost = pathCostOf(this, this._path);
    for (const i of this._path) this.cells[i] = PATH;
  }

  // NOTE: returns a live read-only view (the WASM build returns a copy).
  state() { return this.cells; }
  state_ptr() { return 0; } // only meaningful in the WASM build
  state_len() { return this.cells.length; }
  path() { return this._path; }
  expanded() { return this._expanded; }
  frontier() { return this._frontier; }
  is_done() { return this._done; }
  found() { return this._found; }
  cost() { return this._cost; }
  algo() { return this._algo; }
  start() { return this.startIdx; }
  goal() { return this.goalIdx; }
  free() {} // parity with wasm-bindgen objects
}

/* ---- pure helpers shared by the app and the Node tests ------------- */

// True weighted cost of a path on a domain-like object exposing
// nx/ny/nz/wrap/terrain: per step, the Euclidean base cost of the
// (wrap-aware) move times the weight of the cell being entered.
// Mirrors Solver::path_cost in src/lib.rs.
function pathCostOf(dom, path) {
  const { nx, ny, nz, wrap, terrain } = dom;
  const ad = (a, b, n, w) => {
    let d = Math.abs(a - b);
    if (w) d = Math.min(d, n - d);
    return d;
  };
  let acc = 0;
  for (let s = 1; s < path.length; s++) {
    const a = path[s - 1], b = path[s];
    const k = ad(a % nx, b % nx, nx, wrap[0])
      + ad(((a / nx) | 0) % ny, ((b / nx) | 0) % ny, ny, wrap[1])
      + ad((a / (nx * ny)) | 0, (b / (nx * ny)) | 0, nz, wrap[2]);
    acc += STEP_COST[k] * terrain[b];
  }
  return acc;
}

// A user-drawn route is valid when it starts at start, ends at goal, stays
// on existing unblocked cells, and every step is a legal neighbour move.
function validateRoute(dom, path, startIdx, goalIdx, diagonals) {
  const { nx, ny, nz, wrap, terrain } = dom;
  if (!path.length) return { ok: false, reason: 'empty route' };
  if (path[0] !== startIdx) return { ok: false, reason: 'must begin at start' };
  if (path[path.length - 1] !== goalIdx) return { ok: false, reason: 'must reach the goal' };
  const ad = (a, b, n, w) => {
    let d = Math.abs(a - b);
    if (w) d = Math.min(d, n - d);
    return d;
  };
  for (let s = 0; s < path.length; s++) {
    const t = terrain[path[s]];
    if (t === T_VOID) return { ok: false, reason: 'route leaves the domain' };
    if (t === T_OBST) return { ok: false, reason: 'route crosses an obstacle' };
    if (s === 0) continue;
    const a = path[s - 1], b = path[s];
    const dx = ad(a % nx, b % nx, nx, wrap[0]);
    const dy = ad(((a / nx) | 0) % ny, ((b / nx) | 0) % ny, ny, wrap[1]);
    const dz = ad((a / (nx * ny)) | 0, (b / (nx * ny)) | 0, nz, wrap[2]);
    if (dx > 1 || dy > 1 || dz > 1) return { ok: false, reason: 'route jumps cells' };
    const k = dx + dy + dz;
    if (k < 1) return { ok: false, reason: 'route repeats a cell' };
    if (!diagonals && k > 1) return { ok: false, reason: 'diagonal step with diagonals off' };
  }
  return { ok: true, reason: '' };
}

function mulberry32(seed) {
  let a = seed | 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ---- domain presets -------------------------------------------------
   A Domain is dims + wrap flags + a per-cell existence mask. Cells outside
   the mask are void: untraversable, unrendered, uneditable. The torus is a
   bent prism: grid axis x runs around the ring and wraps, so routes really
   do cross the modular seam (the renderer bends it into a donut). */
function makeDomain(preset, N) {
  const build = (nx, ny, nz, wrap, existsFn, start, goal, label) => {
    const exists = new Uint8Array(nx * ny * nz);
    let count = 0;
    for (let z = 0; z < nz; z++) for (let y = 0; y < ny; y++) for (let x = 0; x < nx; x++) {
      if (existsFn(x, y, z)) { exists[x + nx * (y + ny * z)] = 1; count++; }
    }
    return { preset, nx, ny, nz, wrap, exists, start, goal, count, label };
  };
  if (preset === 'prism') {
    const ny = Math.max(6, Math.round(N * 0.5)), nz = Math.max(8, Math.round(N * 0.8));
    return build(N, ny, nz, [false, false, false], () => true,
      [1, 1, 1], [N - 2, ny - 2, nz - 2], `${N}×${ny}×${nz}`);
  }
  if (preset === 'pyramid') {
    const ny = Math.max(6, Math.round(N * 0.75));
    const maxShrink = Math.floor((N - 3) / 2); // keep the apex >= 3 cells wide
    const sh = y => Math.floor(maxShrink * y / (ny - 1));
    const c = Math.floor(N / 2);
    return build(N, ny, N, [false, false, false],
      (x, y, z) => { const m = sh(y); return x >= m && x <= N - 1 - m && z >= m && z <= N - 1 - m; },
      [1, 0, 1], [c, ny - 1, c], `${N} base · ${ny} tall`);
  }
  if (preset === 'sphere') {
    const c = (N - 1) / 2, r = (N - 1) / 2 + 0.2;
    const rc = Math.round(c);
    return build(N, N, N, [false, false, false],
      (x, y, z) => ((x - c) ** 2 + (y - c) ** 2 + (z - c) ** 2) <= r * r,
      [rc, 1, rc], [rc, N - 2, rc], `r ≈ ${r.toFixed(1)}`);
  }
  if (preset === 'torus') {
    const nu = Math.max(24, Math.round(N * 2.4));
    const d = Math.max(5, Math.round(N * 0.42) | 1); // odd → a true centre cell
    const c = (d - 1) / 2, r = (d - 1) / 2 + 0.2;
    // Endpoints sit just either side of the wrap seam: the short way is
    // through the seam, the long way is around the whole ring.
    return build(nu, d, d, [true, false, false],
      (x, y, z) => ((y - c) ** 2 + (z - c) ** 2) <= r * r,
      [2, c | 0, c | 0], [nu - 3, c | 0, c | 0], `ring ${nu} · bore ${d}`);
  }
  // default: the classic cube
  return build(N, N, N, [false, false, false], () => true,
    [1, 1, 1], [N - 2, N - 2, N - 2], `${N}³`);
}

/* ---- terrain generator ----------------------------------------------
   Terrain bytes: T_VOID outside the mask, 1..W_MAX = weight, T_OBST walls.
   Perforated cross-section walls + floating ellipsoidal clusters + scatter
   + weighted "dense energy" blobs, all from one seeded PRNG so randomize is
   reproducible. Start/goal neighbourhoods are carved clean last. */
function generateTerrain(dom, densityPct, seed, empty) {
  const { nx, ny, nz, wrap, exists, start, goal } = dom;
  const density = densityPct / 100;
  const rnd = mulberry32(seed);
  const total = nx * ny * nz;
  const terrain = new Uint8Array(total);
  for (let i = 0; i < total; i++) terrain[i] = exists[i] ? 1 : T_VOID;
  const id = (x, y, z) => x + nx * (y + ny * z);
  const dims = [nx, ny, nz];

  if (!empty) {
    // Perforated walls: full cross-sections with punched holes. On the
    // torus this is a disc across the bore — the search must find a hole
    // or go the other way around the ring.
    const maxDim = Math.max(nx, ny, nz);
    const wallCount = maxDim >= 18 ? 3 : 2;
    const used = new Set();
    const put = (axis, p, u, v, val) => {
      const c = axis === 0 ? [p, u, v] : axis === 1 ? [u, p, v] : [u, v, p];
      const i = id(c[0], c[1], c[2]);
      if (exists[i]) terrain[i] = val;
    };
    for (let w = 0; w < wallCount; w++) {
      const axis = (rnd() * 3) | 0;
      const n = dims[axis], nu = dims[(axis + 1) % 3], nv = dims[(axis + 2) % 3];
      if (n < 5) continue;
      let p = 2 + ((rnd() * (n - 4)) | 0);
      for (let guard = 0; guard < 24 && (used.has(axis * 1000 + p) || used.has(axis * 1000 + p + 1) || used.has(axis * 1000 + p - 1)); guard++) {
        p = 2 + ((rnd() * (n - 4)) | 0);
      }
      used.add(axis * 1000 + p);
      const uu = axis === 0 ? [1, 2] : axis === 1 ? [0, 2] : [0, 1]; // grid axes spanned
      for (let u = 0; u < dims[uu[0]]; u++) for (let v = 0; v < dims[uu[1]]; v++) {
        put(axis, p, u, v, T_OBST);
      }
      const holes = 1 + ((rnd() * 2) | 0);
      for (let hi = 0; hi < holes; hi++) {
        const hu = 1 + ((rnd() * (dims[uu[0]] - 2)) | 0);
        const hv = 1 + ((rnd() * (dims[uu[1]] - 2)) | 0);
        const r = maxDim >= 16 ? 1 : (rnd() < 0.5 ? 1 : 0);
        for (let du = -r; du <= r; du++) for (let dv = -r; dv <= r; dv++) {
          const cu = hu + du, cv = hv + dv;
          if (cu >= 0 && cv >= 0 && cu < dims[uu[0]] && cv < dims[uu[1]]) put(axis, p, cu, cv, 1);
        }
      }
      for (let u = 0; u < dims[uu[0]]; u++) for (let v = 0; v < dims[uu[1]]; v++) {
        if (rnd() < 0.05) put(axis, p, u, v, 1);
      }
    }

    // Floating obstacle clusters: ellipsoidal blobs suspended in the volume.
    const blobs = 2 + Math.round(density * 14) + ((maxDim / 9) | 0);
    for (let b = 0; b < blobs; b++) {
      const cx = 1 + rnd() * (nx - 2), cy = 1 + rnd() * (ny - 2), cz = 1 + rnd() * (nz - 2);
      const rx = 1 + rnd() * nx * 0.11, ry = 1 + rnd() * ny * 0.11, rz = 1 + rnd() * nz * 0.11;
      const x0 = Math.max(0, Math.floor(cx - rx)), x1 = Math.min(nx - 1, Math.ceil(cx + rx));
      const y0 = Math.max(0, Math.floor(cy - ry)), y1 = Math.min(ny - 1, Math.ceil(cy + ry));
      const z0 = Math.max(0, Math.floor(cz - rz)), z1 = Math.min(nz - 1, Math.ceil(cz + rz));
      for (let z = z0; z <= z1; z++) for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        const dd = ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 + ((z - cz) / rz) ** 2;
        const i = id(x, y, z);
        if (dd <= 1 && rnd() < 0.9 && exists[i]) terrain[i] = T_OBST;
      }
    }

    // Isolated scatter voxels.
    const scatter = density * 0.35;
    for (let i = 0; i < total; i++) if (exists[i] && rnd() < scatter) terrain[i] = T_OBST;

    // Weighted terrain: dense-energy blobs the weighted algorithms can
    // route around (or pay to push through). Weight 1 stays normal ground.
    const wBlobs = 2 + Math.round(total / 1400);
    for (let b = 0; b < wBlobs; b++) {
      const w = 3 + ((rnd() * (W_MAX - 2)) | 0);
      const cx = 1 + rnd() * (nx - 2), cy = 1 + rnd() * (ny - 2), cz = 1 + rnd() * (nz - 2);
      const rr = 1.2 + rnd() * Math.max(nx, ny, nz) * 0.14;
      const x0 = Math.max(0, Math.floor(cx - rr)), x1 = Math.min(nx - 1, Math.ceil(cx + rr));
      const y0 = Math.max(0, Math.floor(cy - rr)), y1 = Math.min(ny - 1, Math.ceil(cy + rr));
      const z0 = Math.max(0, Math.floor(cz - rr)), z1 = Math.min(nz - 1, Math.ceil(cz + rr));
      for (let z = z0; z <= z1; z++) for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
        const dd = ((x - cx) ** 2 + (y - cy) ** 2 + (z - cz) ** 2) / (rr * rr);
        const i = id(x, y, z);
        if (dd <= 1 && exists[i] && terrain[i] !== T_OBST) {
          // soft core: full weight inside, lighter fringe
          terrain[i] = dd < 0.55 ? w : Math.max(2, (w >> 1));
        }
      }
    }
  }

  // Carve the start/goal cells and their (wrap-aware) 26-neighbourhoods
  // back to clean weight-1 ground so endpoints can never be boxed in.
  for (const [cx, cy, cz] of [start, goal]) {
    for (let dz = -1; dz <= 1; dz++) for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      let x = cx + dx, y = cy + dy, z = cz + dz;
      if (x < 0 || x >= nx) { if (!wrap[0]) continue; x = (x + nx) % nx; }
      if (y < 0 || y >= ny) { if (!wrap[1]) continue; y = (y + ny) % ny; }
      if (z < 0 || z >= nz) { if (!wrap[2]) continue; z = (z + nz) % nz; }
      const i = id(x, y, z);
      if (exists[i]) terrain[i] = 1;
    }
  }
  return terrain;
}

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
function hash01(i) {
  i = (i ^ 61) ^ (i >>> 16);
  i = (i + (i << 3)) | 0;
  i = i ^ (i >>> 4);
  i = Math.imul(i, 0x27d4eb2d);
  i = i ^ (i >>> 15);
  return (i >>> 0) / 4294967296;
}
const $ = id => document.getElementById(id);

function showErr(msg) {

const ALGO_META = [
  ['A*',                  'guarantees the shortest path — heuristic-guided'],
  ['DIJKSTRA',            'guarantees the shortest path — explores evenly'],
  ['GREEDY',              'beelines to the goal — fast, no guarantee'],
  ['SWARM',               'goal-biased weighted A* — broad, not optimal'],
  ['CONV SWARM',          'heavy goal bias — narrow funnel, not optimal'],
  ['BI-SWARM',            'two swarms meet in the middle — not optimal'],
  ['BFS',                 'fewest hops — ignores weights & diagonal cost'],
  ['DFS',                 'dives deep — finds a path, rarely a short one'],
];
const DOMAIN_META = {
  cube:    'the classic full box',
  prism:   'non-cubic bounding box',
  pyramid: 'cross-section shrinks with height',
  sphere:  'cells masked by radius — the rest is void',
  torus:   'x wraps around the ring — routes cross the seam',
};

async function main() {

  scene.add(new THREE.AmbientLight(0x2a3f55, 1.0));

  const LIFT = 2.6;        // domain floats above the floor grid

  gridMinor.material.transparent = true;
