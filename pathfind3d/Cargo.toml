[package]
name = "pathfind3d"
version = "0.1.0"
edition = "2021"
description = "Volumetric 26-connected A* core for a 3D pathfinding visualizer (wasm-bindgen)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
